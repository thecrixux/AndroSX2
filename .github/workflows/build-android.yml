name: Build AndroSX2 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Usamos v4, no v3, para evitar el fallo reciente del paquete "tools"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify native ARM64 libraries
        run: |
          echo "Checking native libraries..."

          test -f app/src/main/jniLibs/arm64-v8a/libemucore.so
          test -f app/src/main/jniLibs/arm64-v8a/libSDL2.so

          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version
          sdkmanager --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build AndroSX2 APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Collect APK
        run: |
          echo "Generated APKs:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk -type f -name "*debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/AndroSX2-arm64.apk

          echo "Final APK:"
          ls -lh output/AndroSX2-arm64.apk

      - name: Upload AndroSX2 APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroSX2-Android-arm64
          path: output/AndroSX2-arm64.apk
          if-no-files-found: error
          compression-level: 0
